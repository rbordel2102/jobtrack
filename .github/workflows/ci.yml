name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jobtrack-test-db
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      TEST_BETTER_AUTH_SECRET: ${{ secrets.TEST_BETTER_AUTH_SECRET }}
      TEST_BETTER_AUTH_URL: http://127.0.0.1:3100
      JOBTRACK_TEST_MODE: "true"
      JOBTRACK_AI_PROVIDER: "local"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtrack
          DIRECT_URL: postgresql://ci:ci@localhost:5432/jobtrack
          BETTER_AUTH_SECRET: ci-build-only-secret
          BETTER_AUTH_URL: http://localhost:3000

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply test migrations
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm run test:db:migrate

      - name: Playwright E2E
        id: e2e
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag jobtrack:ci .
